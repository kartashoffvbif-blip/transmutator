# Пример конфигурации сервиса-преобразователя.
# Скопируйте в config.yaml и запустите: ./transformer -config config.yaml

# Обязательный: адрес прослушивания.
listen_addr: ":8080"

# Обязательный: полный целевой апстрим-URL для запросов
# POST /v1/chat/completions. Остальные запросы уходят на тот же
# схема+хост с их исходным путём.
upstream_url: "http://127.0.0.1:11434/v1/chat/completions"

# Обязательный: таймаут на выполнение одного правила (Go duration).
timeout: "2s"

# Необязательный: подробное логирование (оригинал, результат, diff, метрики).
debug: false

# Необязательный: файл для дубля логов (дозапись). Пусто/отсутствует —
# логи только в stdout.
log_file: "transformer.log"

# Необязательный: каталог файлов трассировки запросов (только при
# debug: true): <метка времени>-request.json, -transformed.json,
# -diff.patch — чистый JSON без экранирования. Пусто — выключено.
trace_dir: "logs"

# Обязательный: путь к манифесту правил.
rules_file: "rules.yaml"
